name: Autogoal Bot

on:
  schedule:
    # Cada 30 min, 24h. Cada ejecucion vive 50 min haciendo polling
    # interno cada 2 min, asi que hay solape: si GitHub se salta una
    # tanda, la siguiente recoge lo pendiente.
    - cron: "*/30 * * * *"
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

# Permiso para que el workflow pueda escribir (commit/push) en el repo
# Un solo run a la vez. Sin esto, dos bucles solapados leen el mismo
# publicados.json antes de que ninguno lo actualice y publican el mismo
# partido dos veces. cancel-in-progress mata la tanda vieja al arrancar
# la nueva: cobertura continua, cero duplicados.
concurrency:
  group: autogoal-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publicar-resultados:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests python-dotenv Pillow

      - name: Crear archivo .env desde los secrets
        run: |
          echo "FOOTBALL_DATA_TOKEN=${{ secrets.FOOTBALL_DATA_TOKEN }}" >> .env
          echo "PAGE_ACCESS_TOKEN=${{ secrets.PAGE_ACCESS_TOKEN }}" >> .env
          echo "INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}" >> .env
          echo "IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}" >> .env

      - name: Ejecutar el bot (bucle de 50 min)
        timeout-minutes: 55
        run: python bucle.py

      - name: Guardar publicados.json en el repo
        if: always()
        run: |
          git config user.name "autogoal-bot"
          git config user.email "bot@autogoal.es"
          git add -f publicados.json
          if git diff --staged --quiet; then
            echo "Sin cambios en publicados.json, nada que commitear."
          else
            git commit -m "Actualizar registro de publicados [skip ci]"
            git pull --rebase --autostash
            git push
          fi
