name: Autogoal Bot

on:
  schedule:
    # Cada 10 minutos, entre las 11:00 y 23:00 UTC.
    # UTC+2 (verano espanol) = 13:00 a 01:00 hora espanola.
    - cron: "*/10 11-23 * * *"
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

# Permiso para que el workflow pueda escribir (commit/push) en el repo
permissions:
  contents: write

jobs:
  publicar-resultados:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests python-dotenv Pillow

      - name: Crear archivo .env desde los secrets
        run: |
          echo "FOOTBALL_DATA_TOKEN=${{ secrets.FOOTBALL_DATA_TOKEN }}" >> .env
          echo "PAGE_ACCESS_TOKEN=${{ secrets.PAGE_ACCESS_TOKEN }}" >> .env
          echo "INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}" >> .env
          echo "IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}" >> .env

      - name: Ejecutar el bot
        run: python main.py

      - name: Guardar publicados.json en el repo
        if: always()
        run: |
          git config user.name "autogoal-bot"
          git config user.email "bot@autogoal.es"
          git add -f publicados.json
          if git diff --staged --quiet; then
            echo "Sin cambios en publicados.json, nada que commitear."
          else
            git commit -m "Actualizar registro de publicados [skip ci]"
            git push
          fi
