name: Autogoal Bot

on:
  schedule:
    # Cada 15 minutos, entre las 11:00 y 23:00 UTC.
    # UTC+2 (verano espanol) = 13:00 a 01:00 hora espanola.
    - cron: "*/15 11-23 * * *"
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  publicar-resultados:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests python-dotenv Pillow

      - name: Crear archivo .env desde los secrets
        run: |
          echo "FOOTBALL_DATA_TOKEN=${{ secrets.FOOTBALL_DATA_TOKEN }}" >> .env
          echo "PAGE_ACCESS_TOKEN=${{ secrets.PAGE_ACCESS_TOKEN }}" >> .env
          echo "INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}" >> .env
          echo "IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}" >> .env

      - name: Restaurar registro de publicados
        uses: actions/cache@v4
        with:
          path: publicados.json
          key: publicados-${{ github.run_id }}
          restore-keys: |
            publicados-

      - name: Ejecutar el bot
        run: python main.py

      - name: Guardar registro de publicados
        uses: actions/cache/save@v4
        if: always()
        with:
          path: publicados.json
          key: publicados-${{ github.run_id }}
