name: TEST Nube Autogoal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prueba-nube:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install requests python-dotenv Pillow
      - name: Crear archivo .env desde los secrets
        run: |
          echo "FOOTBALL_DATA_TOKEN=${{ secrets.FOOTBALL_DATA_TOKEN }}" >> .env
          echo "PAGE_ACCESS_TOKEN=${{ secrets.PAGE_ACCESS_TOKEN }}" >> .env
          echo "INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}" >> .env
          echo "IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}" >> .env
      - name: Ejecutar la prueba de nube
        run: python test_nube.py
      - name: Guardar publicados.json en el repo
        if: always()
        run: |
          git config user.name "autogoal-bot"
          git config user.email "bot@autogoal.es"
          git add -f publicados.json
          if git diff --staged --quiet; then
            echo "Sin cambios, nada que commitear."
          else
            git commit -m "TEST: actualizar registro [skip ci]"
            git push
          fi
